[package]
name = "relation-search"
version = "0.2.17"
edition = "2024"
description = "代码检索：PriorSeek RRF 融合 + tantivy BM25 + 代码感知分词/概念别名 + 内嵌 ast-grep 结构召回"
repository = "https://github.com/vesita/relation-search"

[[bin]]
name = "relation-search"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tantivy = "0.27"
jieba-rs = "0.11"
ast-grep-core = "0.51"
ast-grep-language = "0.51"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
globset = "0.4"
# PriorSeek 核心组件
sl-core = { path = "../PriorSeek/crates/sl-core" }
sl-engine = { path = "../PriorSeek/crates/sl-engine" }
sl-bridge = { path = "../PriorSeek/crates/sl-bridge" }
