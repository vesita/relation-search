[package]
name = "code-search"
version = "0.2.1"
edition = "2021"
description = "代码检索：tantivy BM25 + 代码感知分词 + 内嵌 ast-grep 结构召回（无需外部工具）"
repository = "https://github.com/vesita/code-search"

[[bin]]
name = "code-search"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tantivy = "0.27"
jieba-rs = "0.11"
ast-grep-core = "0.51"
ast-grep-language = "0.51"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
